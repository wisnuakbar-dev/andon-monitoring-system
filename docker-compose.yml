services:
  db:
    image: postgres:16-alpine
    container_name: andon-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: andon
      POSTGRES_PASSWORD: andon123
      POSTGRES_DB: andon_db
    ports:
      - "5432:5432"
    volumes:
      - andon_pgdata:/var/lib/postgresql/data

volumes:
  andon_pgdata: